services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quicknote
      POSTGRES_USER: duylong
      POSTGRES_PASSWORD: duylongadminpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/migration:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duylong -d quicknote"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: duylongcontainer/quick-note-backend:latest
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/quicknote
      DB_USERNAME: duylong
      DB_PASSWORD: duylongadminpass
      JPA_DDL_AUTO: validate

  frontend:
    image: duylongcontainer/quick-note-frontend:latest
    build:
      context: .
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
