server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework

app:
  cors:
    # Comma-separated; override with APP_CORS_ALLOWED_ORIGINS in K8s/prod
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,https://quicknote.icestore.art}

spring:
  application:
    name: quick-note-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quicknote}
    username: ${DB_USERNAME:duylong}
    password: ${DB_PASSWORD:duylongadminpass}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        default_schema: public
