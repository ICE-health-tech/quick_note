services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quicknote
      POSTGRES_USER: duylong
      POSTGRES_PASSWORD: duylongadminpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migration:/docker-entrypoint-initdb.d

  backend:
    build: .
    depends_on:
      - postgres
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/quicknote
      DB_USERNAME: duylong
      DB_PASSWORD: duylongadminpass
      JPA_DDL_AUTO: validate

volumes:
  pgdata:
