apiVersion: apps/v1
kind: Deployment
metadata:
  name: quick-note-frontend
  namespace: quick-note
  labels:
    app: quick-note-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quick-note-frontend
  template:
    metadata:
      labels:
        app: quick-note-frontend
    spec:
      containers:
        - name: frontend
          image: duylongcontainer/quick-note-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: quick-note-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: quick-note-frontend
  namespace: quick-note
spec:
  type: NodePort
  selector:
    app: quick-note-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
